openapi: 3.0.3
info:
  description: Enterprise multi-tenant event infrastructure for Credoxa Cloud.
  title: Credoxa Events API
  version: 1.0.0
servers:
- url: /
paths:
  /api/operators/v1/archives/:
    get:
      description: Returns a paginated cross-tenant archive-job listing for authorized
        platform operators.
      operationId: operator_archives_search
      parameters:
      - explode: true
        in: query
        name: completed_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: completed_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: created_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: created_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: ordering
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: retryable
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: source
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: started_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: started_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOperatorArchiveJobList"
          description: Paginated archive search results.
        "400":
          description: Invalid archive-search parameters.
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
      security:
      - cookieAuth: []
      summary: Search archive jobs across organizations
      tags:
      - Operator Console
  /api/operators/v1/archives/{job_id}/:
    get:
      description: Returns one archive job by ID across all organizations. This endpoint
        is restricted to authorized platform operators.
      operationId: operator_archives_retrieve
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorArchiveJob"
          description: ""
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
        "404":
          description: Archive job not found.
      security:
      - cookieAuth: []
      summary: Get an archive job
      tags:
      - Operator Console
  /api/operators/v1/archives/{job_id}/cancel/:
    post:
      description: Cancels a pending archive job across any organization. Operator
        write scope is required.
      operationId: operator_archives_cancel
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorArchiveActionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorArchiveJob"
          description: ""
        "400":
          description: Invalid action request.
        "401":
          description: Authentication required.
        "403":
          description: Operator write scope required.
        "404":
          description: Archive job not found.
        "409":
          description: The archive job cannot be cancelled from its current state.
      security:
      - cookieAuth: []
      summary: Cancel an archive job
      tags:
      - Operator Console
  /api/operators/v1/archives/{job_id}/retry/:
    post:
      description: Transitions a retryable failed archive job back to the pending
        state. Operator write scope is required.
      operationId: operator_archives_retry
      parameters:
      - explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorArchiveActionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorArchiveJob"
          description: ""
        "400":
          description: Invalid action request.
        "401":
          description: Authentication required.
        "403":
          description: Operator write scope required.
        "404":
          description: Archive job not found.
        "409":
          description: The archive job cannot be retried from its current state or
            attempts are exhausted.
      security:
      - cookieAuth: []
      summary: Retry an archive job
      tags:
      - Operator Console
  /api/operators/v1/consumers/:
    get:
      description: Returns a paginated cross-tenant consumer registry listing for
        authorized operators.
      operationId: operator_consumers_search
      parameters:
      - explode: true
        in: query
        name: code
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: created_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: created_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: dead_letter_queue
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: ordering
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: owner_service
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: queue_name
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: updated_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: updated_before
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOperatorConsumerRegistrationList"
          description: Paginated consumer search results.
        "400":
          description: Invalid consumer search parameters.
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
      security:
      - cookieAuth: []
      summary: Search consumers across organizations
      tags:
      - Operator Console
  /api/operators/v1/consumers/{consumer_id}/:
    get:
      description: "Returns one consumer registration, including its routing bindings,\
        \ across all organizations. Operator read scope is required."
      operationId: operator_consumers_retrieve
      parameters:
      - explode: false
        in: path
        name: consumer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorConsumerDetail"
          description: ""
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
        "404":
          description: Consumer registration not found.
      security:
      - cookieAuth: []
      summary: Get a consumer registration
      tags:
      - Operator Console
  /api/operators/v1/consumers/{consumer_id}/runtime-health/:
    get:
      description: "Collects current assignment, worker, supervisor, and delivery\
        \ observations for one consumer and evaluates its runtime health. The endpoint\
        \ is cross-tenant and restricted to authorized platform operators."
      operationId: operator_consumer_runtime_health_retrieve
      parameters:
      - explode: false
        in: path
        name: consumer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorConsumerRuntimeHealth"
          description: ""
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
        "404":
          description: Consumer registration was not found.
      security:
      - cookieAuth: []
      summary: Get consumer runtime health
      tags:
      - Operators
  /api/operators/v1/consumers/{consumer_id}/runtime-snapshot/:
    get:
      description: "Collects the current assignment, worker, supervisor, and delivery\
        \ observations for one consumer. Source-specific collection failures are returned\
        \ in source_errors while successfully collected sections remain available."
      operationId: operator_consumer_runtime_snapshot_retrieve
      parameters:
      - explode: false
        in: path
        name: consumer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorConsumerRuntimeSnapshot"
          description: ""
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
        "404":
          description: Consumer registration was not found.
      security:
      - cookieAuth: []
      summary: Get consumer runtime snapshot
      tags:
      - Operators
  /api/operators/v1/consumers/runtime-dashboard/:
    get:
      description: "Builds a current platform-wide or organization-scoped consumer\
        \ runtime dashboard containing KPIs, health and lifecycle distributions, operational\
        \ alerts, collection status, and ranked consumers requiring attention."
      operationId: operator_consumer_runtime_dashboard_retrieve
      parameters:
      - description: Optional organization scope. Omit this value to build a platform-wide
          dashboard.
        explode: true
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      - description: Maximum number of consumers requiring attention to include in
          the ranked result.
        explode: true
        in: query
        name: top_limit
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorRuntimeDashboardResponse"
          description: ""
        "400":
          description: Invalid organization_id or top_limit.
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
      security:
      - cookieAuth: []
      summary: Get consumer runtime dashboard
      tags:
      - Operators
  /api/operators/v1/consumers/runtime-metrics/:
    get:
      description: Collects and aggregates current consumer runtime metrics across
        the platform or within one organization. Individual collection failures are
        returned in the collection section while successful consumers continue contributing
        to the aggregate.
      operationId: operator_consumer_runtime_metrics_retrieve
      parameters:
      - description: Include normalized per-consumer runtime metric points in the
          response.
        explode: true
        in: query
        name: include_points
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Optional organization filter. Omit this value to collect platform-wide
          runtime metrics.
        explode: true
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorRuntimeMetricsResponse"
          description: ""
        "400":
          description: Invalid query parameters.
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
      security:
      - cookieAuth: []
      summary: Get consumer runtime metrics
      tags:
      - Operators
  /api/operators/v1/consumers/summary/:
    get:
      description: Returns cross-tenant consumer registry and consumer-delivery operational
        aggregates for authorized platform operators.
      operationId: operator_consumers_summary_retrieve
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorConsumerSummary"
          description: ""
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
      security:
      - cookieAuth: []
      summary: Get consumer platform summary
      tags:
      - Operator Console
  /api/operators/v1/replays/:
    get:
      description: Returns a paginated cross-tenant replay-job listing for authorized
        platform operators.
      operationId: operator_replays_search
      parameters:
      - explode: true
        in: query
        name: completed_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: completed_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: created_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: created_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: failed_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: failed_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: ordering
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: requested_by
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: started_after
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: started_before
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: target_consumer_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOperatorReplayJobList"
          description: Paginated replay search results.
        "400":
          description: Invalid replay-search parameters.
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
      security:
      - cookieAuth: []
      summary: Search replay jobs across organizations
      tags:
      - Operator Console
  /api/operators/v1/replays/{replay_id}/:
    get:
      description: Returns one replay job by ID across all organizations. This endpoint
        is restricted to authorized platform operators.
      operationId: operator_replays_retrieve
      parameters:
      - explode: false
        in: path
        name: replay_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorReplayJob"
          description: ""
        "401":
          description: Authentication required.
        "403":
          description: Operator read scope required.
        "404":
          description: Replay job not found.
      security:
      - cookieAuth: []
      summary: Get a replay job
      tags:
      - Operator Console
  /api/operators/v1/replays/{replay_id}/cancel/:
    post:
      description: Cancels or requests cancellation of a replay job across any organization.
        Operator write scope is required.
      operationId: operator_replays_cancel
      parameters:
      - explode: false
        in: path
        name: replay_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorReplayJob"
          description: ""
        "400":
          description: Invalid request body.
        "401":
          description: Authentication required.
        "403":
          description: Operator write scope required.
        "404":
          description: Replay job not found.
        "409":
          description: Replay cannot be cancelled from its current state.
      security:
      - cookieAuth: []
      summary: Cancel a replay job
      tags:
      - Operator Console
  /api/operators/v1/replays/{replay_id}/pause/:
    post:
      description: Pauses a running replay job across any organization. Operator write
        scope is required.
      operationId: operator_replays_pause
      parameters:
      - explode: false
        in: path
        name: replay_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorReplayJob"
          description: ""
        "400":
          description: Invalid request body.
        "401":
          description: Authentication required.
        "403":
          description: Operator write scope required.
        "404":
          description: Replay job not found.
        "409":
          description: Replay cannot be paused from its current state.
      security:
      - cookieAuth: []
      summary: Pause a replay job
      tags:
      - Operator Console
  /api/operators/v1/replays/{replay_id}/resume/:
    post:
      description: Resumes a paused replay job across any organization. Operator write
        scope is required.
      operationId: operator_replays_resume
      parameters:
      - explode: false
        in: path
        name: replay_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorReplayJob"
          description: ""
        "400":
          description: Invalid request body.
        "401":
          description: Authentication required.
        "403":
          description: Operator write scope required.
        "404":
          description: Replay job not found.
        "409":
          description: Replay cannot be resumed from its current state.
      security:
      - cookieAuth: []
      summary: Resume a replay job
      tags:
      - Operator Console
  /api/operators/v1/replays/{replay_id}/retry/:
    post:
      description: Creates a new pending replay from a failed replay job. The original
        failed replay remains unchanged.
      operationId: operator_replays_retry
      parameters:
      - explode: false
        in: path
        name: replay_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRetryRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorReplayJob"
          description: ""
        "400":
          description: Invalid request body.
        "401":
          description: Authentication required.
        "403":
          description: Operator write scope required.
        "404":
          description: Replay job not found.
        "409":
          description: Only failed replay jobs may be retried.
      security:
      - cookieAuth: []
      summary: Retry a failed replay job
      tags:
      - Operator Console
  /api/operators/v1/runtime-incident-notifications/:
    get:
      operationId: operator_runtime_incident_notification_search
      parameters:
      - explode: true
        in: query
        name: consumer_code
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: form
      - explode: true
        in: query
        name: consumer_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: created_from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: created_to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: event_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: event_type
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: form
      - explode: true
        in: query
        name: incident_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: lease_expired
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: leased
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: next_attempt_from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: next_attempt_to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: occurrence_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: |-
          * `next_attempt_at` - next_attempt_at
          * `-next_attempt_at` - -next_attempt_at
          * `created_at` - created_at
          * `-created_at` - -created_at
          * `attempt_count` - attempt_count
          * `-attempt_count` - -attempt_count
          * `event_type` - event_type
          * `-event_type` - -event_type
          * `status` - status
          * `-status` - -status
        explode: true
        in: query
        name: ordering
        required: false
        schema:
          default: next_attempt_at
          enum:
          - next_attempt_at
          - -next_attempt_at
          - created_at
          - -created_at
          - attempt_count
          - -attempt_count
          - event_type
          - -event_type
          - status
          - -status
          minLength: 1
          type: string
        style: form
      - explode: true
        in: query
        name: organization_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: A page number within the paginated result set.
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page.
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: ready
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: severity
        required: false
        schema:
          maxLength: 32
          minLength: 1
          type: string
        style: form
      - description: |-
          * `pending` - Pending
          * `publishing` - Publishing
          * `published` - Published
          * `failed` - Failed
          * `dead_letter` - Dead letter
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - publishing
          - published
          - failed
          - dead_letter
          minLength: 1
          type: string
        style: form
      - explode: true
        in: query
        name: tenant_key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOperatorRuntimeIncidentNotificationListList"
